name: Buscar prospectos

"on":
  workflow_dispatch:
    inputs:
      busqueda:
        description: "Consulta(s). Varias separadas por ; (ej. peluquerías en CABA; odontólogos en Morón)"
        required: true
        type: string
      expandir:
        description: "Expandir zonas amplias (CABA→48 barrios, zona norte/oeste/sur, GBA)"
        required: false
        default: true
        type: boolean
      min_rating:
        description: "Rating mínimo"
        required: false
        default: "4.0"
        type: string
      min_resenas:
        description: "Cantidad mínima de reseñas"
        required: false
        default: "10"
        type: string
      profundidad:
        description: "Profundidad (-depth). Default 1 = rápido (~1 min por zona en paralelo)"
        required: false
        default: "1"
        type: string
      queries:
        description: "JSON array de queries explícitas. Si está presente, se usa tal cual (sin expandir)."
        required: false
        default: ""
        type: string
  issues:
    types: [opened]

concurrency:
  group: buscar-prospectos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (startsWith(github.event.issue.title, 'Buscar:') ||
         contains(join(github.event.issue.labels.*.name, ','), 'busqueda')))
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      count: ${{ steps.expand.outputs.count }}
      busqueda: ${{ steps.query.outputs.busqueda }}
      depth: ${{ steps.query.outputs.depth }}
      min_rating: ${{ steps.query.outputs.min_rating }}
      min_resenas: ${{ steps.query.outputs.min_resenas }}
      issue_number: ${{ steps.query.outputs.issue_number }}
      queries_json: ${{ steps.query.outputs.queries_json }}
      seleccion: ${{ steps.expand.outputs.seleccion }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver query
        id: query
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUSQUEDA: ${{ inputs.busqueda }}
          INPUT_EXPANDIR: ${{ inputs.expandir }}
          INPUT_DEPTH: ${{ inputs.profundidad }}
          INPUT_RATING: ${{ inputs.min_rating }}
          INPUT_RESENAS: ${{ inputs.min_resenas }}
          INPUT_QUERIES: ${{ inputs.queries }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issues" ]; then
            TITLE="$ISSUE_TITLE"
            # Quitar prefijo Buscar: (case insensitive)
            Q=$(printf '%s' "$TITLE" | sed -E 's/^[Bb][Uu][Ss][Cc][Aa][Rr]:[[:space:]]*//')
            Q=$(printf '%s' "$Q" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            DEPTH="4"
            RATING="4.0"
            RESENAS="10"
            EXPANDIR="true"
            ISSUE_NUM="$ISSUE_NUMBER"
            QUERIES_JSON=""
          else
            Q="$INPUT_BUSQUEDA"
            DEPTH="${INPUT_DEPTH:-1}"
            RATING="${INPUT_RATING:-4.0}"
            RESENAS="${INPUT_RESENAS:-10}"
            EXPANDIR="${INPUT_EXPANDIR:-true}"
            ISSUE_NUM=""
            QUERIES_JSON="${INPUT_QUERIES:-}"
          fi
          # Normalizar expandir (boolean input / string "true"|"false"|True|0|no)
          case "$(printf '%s' "$EXPANDIR" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|y|si|sí) EXPANDIR="true" ;;
            ""|0|false|no|n) EXPANDIR="false" ;;
            *) EXPANDIR="true" ;;
          esac
          # Normalizar queries JSON (trim, tratar "null"/[] vacíos)
          QUERIES_JSON=$(printf '%s' "${QUERIES_JSON:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ "$QUERIES_JSON" = "null" ] || [ "$QUERIES_JSON" = "[]" ] || [ "$QUERIES_JSON" = '""' ]; then
            QUERIES_JSON=""
          fi
          if [ "$EVENT_NAME" = "issues" ]; then QUERIES_JSON=""; fi
          if [ -z "$Q" ] && [ -z "$QUERIES_JSON" ]; then
            echo "ERROR: query vacía" >&2
            exit 1
          fi
          # Si hay lista explícita, forzar no-expandir
          if [ -n "$QUERIES_JSON" ]; then
            EXPANDIR="false"
            if [ -z "$Q" ]; then
              Q="queries explícitas"
            fi
          fi
          {
            echo "busqueda<<EOF"
            echo "$Q"
            echo "EOF"
            echo "depth=$DEPTH"
            echo "min_rating=$RATING"
            echo "min_resenas=$RESENAS"
            echo "expandir=$EXPANDIR"
            echo "issue_number=$ISSUE_NUM"
            echo "queries_json<<EOFQ"
            echo "$QUERIES_JSON"
            echo "EOFQ"
          } >> "$GITHUB_OUTPUT"
          echo "Query: $Q"
          echo "Depth: $DEPTH | Expandir: $EXPANDIR | Issue: ${ISSUE_NUM:-ninguno}"
          if [ -n "$QUERIES_JSON" ]; then
            echo "Queries JSON presentes (explícitas)"
          fi

      - name: Comentar en el issue (inicio)
        if: steps.query.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.query.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" \
            --body "🔎 Buscando… te aviso acá cuando termine"

      - name: Expandir queries → matrix JSON
        id: expand
        env:
          BUSQUEDA: ${{ steps.query.outputs.busqueda }}
          EXPANDIR: ${{ steps.query.outputs.expandir }}
          QUERIES_JSON: ${{ steps.query.outputs.queries_json }}
        run: |
          set -euo pipefail
          mkdir -p output final docs/data
          if [ -n "${QUERIES_JSON:-}" ]; then
            echo "Usando lista explícita de queries (sin expandir)"
            python3 << 'PY'
          import json, os, sys
          raw = os.environ.get("QUERIES_JSON", "") or ""
          raw = raw.strip().lstrip("\ufeff")
          data = []
          if raw:
              try:
                  data = json.loads(raw)
              except Exception as e1:
                  # A veces llega doble-encodeado como '"[...]"'
                  try:
                      data = json.loads(json.loads(raw))
                  except Exception:
                      print("ERROR: queries JSON inválido:", e1, file=sys.stderr)
                      print("raw[:200]=", repr(raw[:200]), file=sys.stderr)
                      sys.exit(1)
          if isinstance(data, str):
              # Una sola query como string
              data = [data]
          if not isinstance(data, list):
              print("ERROR: queries debe ser un array", file=sys.stderr)
              sys.exit(1)
          queries = []
          seen = set()
          for item in data:
              q = str(item or "").strip()
              if not q or q in seen:
                  continue
              seen.add(q)
              queries.append(q)
          open("queries.txt", "w", encoding="utf-8").write("\n".join(queries) + ("\n" if queries else ""))
          matrix = [{"i": i, "q": q} for i, q in enumerate(queries)]
          open("matrix.json", "w", encoding="utf-8").write(json.dumps(matrix, ensure_ascii=False) + "\n")
          print(f"Explícitas: {len(queries)}")
          for i, q in enumerate(queries):
              print(f"  [{i}] {q}")
          PY
          else
            printf '%s\n' "$BUSQUEDA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > queries_raw.txt
            echo "Queries originales:"
            cat -n queries_raw.txt
            case "$(printf '%s' "${EXPANDIR:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|y|si|sí) DO_EXPAND=1 ;;
              *) DO_EXPAND=0 ;;
            esac
            if [ "$DO_EXPAND" = "1" ]; then
              python3 expandir.py queries_raw.txt queries.txt --json-out matrix.json
            else
              python3 expandir.py queries_raw.txt queries.txt --no-expand --json-out matrix.json
            fi
          fi
          echo "Queries (pre-variantes):"
          cat -n queries.txt || true
          # Rubro y barrios de ESTA búsqueda, antes de los sinónimos.
          cp queries.txt queries_base.txt
          python3 seleccion.py queries_base.txt seleccion.json
          # Expandir sinónimos de rubro (abogados→estudio jurídico, etc.)
          python3 variantes.py queries.txt queries_var.txt
          mv queries_var.txt queries.txt
          echo "Queries (con variantes):"
          cat -n queries.txt
          # Agrupar en batches (hasta 20 a la vez; si hay más, esperan turno)
          python3 batch_matrix.py queries.txt matrix.json --max-jobs 60 --batch 4
          COUNT=$(python3 -c 'import json; print(len(json.load(open("matrix.json"))))')
          NQ=$(wc -l < queries.txt | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo '[]' > matrix.json
          fi
          {
            echo "count=$COUNT"
            echo "matrix<<EOFMATRIX"
            python3 -c 'import json; print(json.dumps(json.load(open("matrix.json")), ensure_ascii=False))'
            echo "EOFMATRIX"
            echo "seleccion<<EOFSEL"
            cat seleccion.json
            echo "EOFSEL"
          } >> "$GITHUB_OUTPUT"
          echo "Total: $NQ queries en $COUNT jobs (batch)"

      - name: Marcar estado in-progress (Pages)
        env:
          BUSQUEDA: ${{ steps.query.outputs.busqueda }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          # Argentina sin DST desde 2009 → UTC-3 fijo (runners nuevos no traen tzdata)
          TZ = timezone(timedelta(hours=-3))
          now = datetime.now(TZ)
          estado = {
              "status": "in_progress",
              "query": os.environ.get("BUSQUEDA", ""),
              "started_at": now.isoformat(timespec="seconds"),
              "started_at_label": now.strftime("%Y-%m-%d %H:%M (America/Buenos_Aires)"),
              "started_at_epoch": int(now.timestamp()),
          }
          open("docs/data/estado.json", "w", encoding="utf-8").write(
              json.dumps(estado, ensure_ascii=False, indent=2) + "\n"
          )
          print(estado)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/estado.json
          if git diff --staged --quiet; then
            echo "estado.json sin cambios"
          else
            git commit -m "estado: buscando — ${BUSQUEDA}"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push falló (intento $attempt), rebase…"
              git pull --rebase origin "${{ github.ref_name }}" || true
              if [ "$attempt" = "3" ]; then
                git push
              fi
            done
          fi

  scrape:
    name: Scrape ${{ matrix.i }}
    needs: preparar
    if: needs.preparar.outputs.count != '0' && needs.preparar.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.preparar.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correr scraper (depth 1, paralelo)
        env:
          DISABLE_TELEMETRY: "1"
          QUERY: ${{ matrix.q }}
          DEPTH: ${{ needs.preparar.outputs.depth }}
          IDX: ${{ matrix.i }}
        run: |
          set -euo pipefail
          mkdir -p output
          # matrix.q puede traer varias queries separadas por |||
          python3 -c 'import os; q=os.environ.get("QUERY",""); open("query.txt","w",encoding="utf-8").write(q.replace("|||","\n").strip()+"\n")'
          NQ=$(wc -l < query.txt | tr -d " ")
          DEPTH_N="${DEPTH:-1}"
          # concurrencia del scraper ≈ min(4, NQ) ; timeout según profundidad
          if [ "$NQ" -lt 2 ]; then C=2; elif [ "$NQ" -gt 4 ]; then C=4; else C="$NQ"; fi
          # depth 1 se cortaba a los 2 min (el contenedor moría con exit 137)
          # y solo alcanzaba la primera página de Maps (~20). Con más depth
          # hay que dejarlo terminar: el scraper documenta hasta 10.
          if [ "$DEPTH_N" -ge 8 ] 2>/dev/null; then
            TO=12m
            IDLE=2m
          elif [ "$DEPTH_N" -ge 3 ] 2>/dev/null; then
            TO=8m
            IDLE=90s
          else
            TO=4m
            IDLE=45s
          fi
          echo "Batch [$IDX]: $NQ queries | depth=$DEPTH_N | -c $C | timeout $TO"
          cat -n query.txt
          docker pull gosom/google-maps-scraper
          set +e
          timeout --signal=TERM --kill-after=25s "$TO" docker run --rm --init \
            -e DISABLE_TELEMETRY=1 \
            -v "$PWD:/work" \
            -w /work \
            gosom/google-maps-scraper \
            -input /work/query.txt \
            -results /work/output/raw.csv \
            -c "$C" \
            -depth "$DEPTH_N" \
            -lang es \
            -exit-on-inactivity "$IDLE"
          rc=$?
          set -e
          echo "docker/timeout exit=$rc"
          ls -la output/ || true
          if [ ! -f output/raw.csv ]; then
            echo "WARN: sin raw.csv (rc=$rc) — placeholder vacío"
            echo "title,phone,website,review_rating,review_count,link,address,category" > output/raw.csv
          fi
          cp query.txt "output/query.txt"

      - name: Subir raw-${{ matrix.i }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.i }}
          path: |
            output/raw.csv
            output/query.txt
          if-no-files-found: error
          retention-days: 7

  unir:
    name: Unir y publicar
    needs: [preparar, scrape]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar raw-*
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw_parts
          merge-multiple: false

      - name: Concatenar, filtrar, resumen
        id: process
        env:
          BUSQUEDA: ${{ needs.preparar.outputs.busqueda }}
          MIN_RATING: ${{ needs.preparar.outputs.min_rating }}
          MIN_RESENAS: ${{ needs.preparar.outputs.min_resenas }}
          SELECCION_JSON: ${{ needs.preparar.outputs.seleccion }}
        run: |
          set -euo pipefail
          mkdir -p output final docs/data raw_parts
          echo "Artefactos descargados:"
          find raw_parts -type f | sort || true

          # Concatenar CSVs (header del primero, resto sin header)
          : > output/raw.csv
          FIRST=1
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then
              continue
            fi
            if [ "$FIRST" = "1" ]; then
              cat "$f" >> output/raw.csv
              FIRST=0
            else
              # saltar header
              tail -n +2 "$f" >> output/raw.csv
            fi
          done < <(find raw_parts -type f -name 'raw.csv' | sort)

          if [ ! -s output/raw.csv ] || [ "$FIRST" = "1" ]; then
            echo "title,phone,website,review_rating,review_count,link,address,category" > output/raw.csv
            echo "Sin resultados crudos (scrape vacío o falló)."
          fi

          wc -l output/raw.csv
          python3 filtrar.py output/raw.csv final/limpio.csv \
            --min-rating "${MIN_RATING:-4.0}" \
            --min-reviews "${MIN_RESENAS:-10}" \
            --modo or

          printf '%s\n' "${SELECCION_JSON:-}" > seleccion.json
          python3 resumen.py \
            --limpio final/limpio.csv \
            --raw output/raw.csv \
            --query "$BUSQUEDA" \
            --json-dir docs/data \
            --seleccion seleccion.json \
            --max-items 100

          N_LIMPIO=$(python3 -c 'import csv; print(sum(1 for _ in csv.DictReader(open("final/limpio.csv",encoding="utf-8"))))')
          echo "n_limpio=$N_LIMPIO" >> "$GITHUB_OUTPUT"
          echo "Limpio: $N_LIMPIO"

      - name: Limpiar estado + commit Pages
        if: always()
        env:
          BUSQUEDA: ${{ needs.preparar.outputs.busqueda }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Guardar lo generado por resumen (el checkout es el SHA del dispatch,
          # no el tip con estado in_progress de Preparar)
          mkdir -p /tmp/docs-out
          if [ -d docs/data ]; then
            cp -a docs/data/. /tmp/docs-out/
          fi
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          mkdir -p docs/data
          cp -a /tmp/docs-out/. docs/data/
          python3 << 'PY'
          import json
          open("docs/data/estado.json", "w", encoding="utf-8").write(
              json.dumps({"status": "idle"}, ensure_ascii=False, indent=2) + "\n"
          )
          PY
          git add docs/data/
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/data"
          else
            git commit -m "prospectos: $(date -u +%Y-%m-%dT%H:%MZ) — ${BUSQUEDA}"
            for attempt in 1 2 3; do
              if git push; then
                echo "Push OK"
                break
              fi
              echo "push falló (intento $attempt), reset a tip + reaplicar…"
              mkdir -p /tmp/docs-out2
              cp -a docs/data/. /tmp/docs-out2/
              git fetch origin "${{ github.ref_name }}"
              git reset --hard "origin/${{ github.ref_name }}"
              cp -a /tmp/docs-out2/. docs/data/
              python3 -c 'import json; open("docs/data/estado.json","w",encoding="utf-8").write(json.dumps({"status":"idle"},ensure_ascii=False,indent=2)+"\n")'
              git add docs/data/
              git commit -m "prospectos: $(date -u +%Y-%m-%dT%H:%MZ) — ${BUSQUEDA}" || true
              if [ "$attempt" = "3" ]; then
                git push
              fi
            done
          fi

      - name: Comentar y cerrar issue
        if: always() && needs.preparar.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.preparar.outputs.issue_number }}
          N_LIMPIO: ${{ steps.process.outputs.n_limpio }}
          BUSQUEDA: ${{ needs.preparar.outputs.busqueda }}
          PAGES: https://paginadeprueba-collab.github.io/maps-prospectos/
        run: |
          set -euo pipefail
          COUNT="${N_LIMPIO:-0}"
          BODY=$(printf '✅ Listo: **%s** prospectos limpios para «%s».\n\n👉 Ver en la página: %s\n\n(Si no aparece todavía, esperá 1 minuto y recargá.)' \
            "$COUNT" "$BUSQUEDA" "$PAGES")
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "$BODY"
          gh issue close "$ISSUE" --repo "${{ github.repository }}" --reason completed || true

      - name: Subir artifact prospectos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospectos
          path: |
            output/raw.csv
            final/limpio.csv
          if-no-files-found: warn
          retention-days: 14
